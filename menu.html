  <title>Menu</title>
  <link rel='stylesheet' href='./style.css' >
  <style>

    h1 {
      text-align: center;
      margin: 20px 0;
      font-size: 2rem;
    }

    form {
      max-width: 600px;
      margin: auto;
    }

    .menu-section {
      margin-bottom: 25px;
    }

    .menu-option {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 8px 0;
    }

    .menu-option label {
      flex: 1;
    }

    .menu-option input[type="checkbox"] {
      appearance: none;
      width: 18px;
      height: 18px;
      border: 2px solid #555;
      border-radius: 5px;
      margin-right: 10px;
      cursor: pointer;
    }

    .menu-option input[type="checkbox"]:checked {
      background-color: #ff6347;
    }

    .quantity {
      width: 50px;
      margin-left: 10px;
    }

    textarea {
      width: 100%;
      height: 80px;
      margin-top: 10px;
    }

    .order-btn {
      display: block;
      background-color: #ff6347;
      color: white;
      padding: 12px 20px;
      font-size: 1rem;
      margin: 20px auto;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      text-align: center;
    }

      .note {
      font-size: 0.9rem;
      color: gray;
      text-align: left;
      margin-bottom: 10px;
    }

    @media (max-width: 600px) {
      .menu-option {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
  <script>
    // Toggle quantity field based on checkbox selection
    document.addEventListener('DOMContentLoaded', () => {
      document.querySelectorAll('input[type="checkbox"]').forEach(checkbox => {
        checkbox.addEventListener('change', function () {
          const qtyInput = this.closest('.menu-option').querySelector('.quantity');
          if (qtyInput) {
            qtyInput.disabled = !this.checked;
          }
        });
      });
    });
  </script>
</head>
